packages:
  - 'apps/*'
  - 'apps/workers/*'
  - 'packages/*'

allowBuilds:
  '@apollo/protobufjs': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@next/env@16.4.0-canary.9'
  - '@next/swc-darwin-arm64@16.4.0-canary.9'
  - '@next/swc-darwin-x64@16.4.0-canary.9'
  - '@next/swc-linux-arm64-gnu@16.4.0-canary.9'
  - '@next/swc-linux-arm64-musl@16.4.0-canary.9'
  - '@next/swc-linux-x64-gnu@16.4.0-canary.9'
  - '@next/swc-linux-x64-musl@16.4.0-canary.9'
  - '@next/swc-win32-arm64-msvc@16.4.0-canary.9'
  - '@next/swc-win32-x64-msvc@16.4.0-canary.9'
  - '@playwright/test@1.63.0-alpha-2026-08-27'
  - '@prisma/adapter-neon@8.1.0-dev.2'
  - '@prisma/client-runtime-utils@8.1.0-dev.2'
  - '@prisma/client@8.1.0-dev.2'
