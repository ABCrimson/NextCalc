  - '@prisma/debug@8.1.0-dev.2'
  - '@prisma/driver-adapter-utils@8.1.0-dev.2'
  - '@prisma/engines@8.1.0-dev.2'
  - '@prisma/fetch-engine@8.1.0-dev.2'
  - '@prisma/get-platform@8.1.0-dev.2'
  - '@radix-ui/react-slider@1.5.0-rc.1785512840124'
  - '@turbo/darwin-64@2.10.13-canary.1'
  - '@turbo/darwin-arm64@2.10.13-canary.1'
  - '@turbo/linux-64@2.10.13-canary.1'
  - '@turbo/linux-arm64@2.10.13-canary.1'
  - '@turbo/windows-64@2.10.13-canary.1'
  - '@turbo/windows-arm64@2.10.13-canary.1'
  - '@types/three@0.185.4'
  - lucide-react@1.34.0
  - miniflare@5.20260826.0-alpha
  - next@16.4.0-canary.9
  - playwright-core@1.63.0-alpha-2026-08-27
  - playwright@1.63.0-alpha-2026-08-27
  - prisma@8.1.0-dev.2
  - radix-ui@1.7.0-rc.1785512840124
  - react-dom@19.3.0-canary-a1124489-20260826
  - react@19.3.0-canary-a1124489-20260826
  - scheduler@0.28.0-canary-a1124489-20260826
  - turbo@2.10.13-canary.1
  - wrangler@4.127.0
  - '@axe-core/playwright@4.13.1-73a9b84.0.sha-73a9b84'
  - '@cloudflare/workers-types@5.20260827.1'
  - '@eloqnt/config@0.0.2'
  - '@eloqnt/format-json@0.0.3'
  - '@eloqnt/format-po@0.0.3'
